# 每次执行前只需修改此文件，无需在命令行传入运行参数。
device:
  name: "705z#1"
  # 连接多台手机时填写 adb devices 显示的序列号；单台手机保持 null。
  serial: null

cycle:
  # 需要确认的阀门实际动作次数。试跑改为 4，正式测试可改为 80。
  moves: 78
  # 每个页面状态或开度变化最多等待秒数。
  timeout_seconds: 13
  # 读取 Android UI 的轮询间隔秒数。
  poll_interval_seconds: 1
  # 关阀模式设温必须低于室温，开阀模式设温必须高于室温。
  close_mode: "节能"
  open_mode: "舒适"

output:
  # 相对路径基于本 config.yaml 所在目录，即 scripts/trv-runs。
  runs_dir: "trv-runs"
